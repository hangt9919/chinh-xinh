<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chỉnh Xinh">
<meta name="description" content="Chỉnh ảnh, làm đẹp, kéo thon mặt, trắng răng, nhuộm tóc ngay trên điện thoại. Ảnh xử lý trên máy, không tải lên.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Chỉnh Xinh</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button id="btnOpen" class="icon-btn" aria-label="Mở ảnh khác"><i data-lucide="image-plus"></i></button>
    <div class="mid">
      <button id="btnUndo" class="icon-btn" aria-label="Hoàn tác" disabled><i data-lucide="undo-2"></i></button>
      <button id="btnRedo" class="icon-btn" aria-label="Làm lại" disabled><i data-lucide="redo-2"></i></button>
      <button id="btnCompare" class="icon-btn" aria-label="Giữ để xem ảnh gốc"><i data-lucide="columns-2"></i></button>
    </div>
    <button id="btnSave" class="save-btn" disabled>Lưu</button>
  </header>

  <main id="stage">
    <div id="wrap"><canvas id="cv"></canvas><canvas id="lyr"></canvas><img id="orig" alt="" hidden></div>
    <canvas id="overlay"></canvas>
    <div id="cropBox" hidden>
      <div class="grid"></div>
      <span class="h tl" data-h="tl"></span><span class="h tr" data-h="tr"></span>
      <span class="h bl" data-h="bl"></span><span class="h br" data-h="br"></span>
    </div>
    <div id="empty">
      <div class="logo"><i data-lucide="sparkles"></i></div>
      <h1>Chỉnh Xinh</h1>
      <p>Chỉnh màu, làm đẹp, kéo thon, trắng răng, nhuộm tóc — ngay trên điện thoại.</p>
      <div class="cta">
        <button id="btnPick" class="primary"><i data-lucide="images"></i>Chọn ảnh</button>
        <button id="btnCam" class="ghost"><i data-lucide="camera"></i>Chụp ảnh</button>
      </div>
      <small><i data-lucide="shield-check"></i>Ảnh được xử lý ngay trên máy bạn, không tải lên đâu cả.</small>
    </div>
    <div id="busy" hidden><div class="spin"></div><span>Đang mở ảnh…</span></div>
    <div id="toast"></div>
  </main>

  <section id="panel" class="off">
    <div id="opts"></div>
    <div id="tools"></div>
    <nav id="tabs"></nav>
  </section>
</div>

<input type="file" id="fileIn" accept="image/*" hidden>
<input type="file" id="camIn" accept="image/*" capture="user" hidden>
<input type="file" id="layerIn" accept="image/*" hidden>
<input type="file" id="refIn" accept="image/*" hidden>

<div id="cutout" hidden>
  <header class="top">
    <button id="cutCancel" class="text">Huỷ</button>
    <b>Cắt người / vật</b>
    <button id="cutDone" class="save-btn">Xong</button>
  </header>
  <div id="cutStage">
    <canvas id="cutCv"></canvas>
    <canvas id="cutOv"></canvas>
    <div id="cutHint" hidden></div>
    <div id="cutBusy" hidden><div class="spin"></div><span></span></div>
  </div>
  <div class="cut-panel">
    <div class="opt-row">
      <div class="seg" id="cutMode"><button data-m="lasso">✏️ Khoanh</button><button data-m="tap" class="on">👆 Chạm</button><button data-m="add">Tô thêm</button><button data-m="erase">Xoá bớt</button></div>
      <button class="icon-btn" id="cutUndo" aria-label="Hoàn tác" disabled><i data-lucide="undo-2"></i></button>
    </div>
    <div class="opt-row"><label>Cỡ cọ</label><input type="range" id="cutSize" min="6" max="90" value="30"></div>
    <div class="opt-row"><label>Viền mềm</label><input type="range" id="cutFeather" min="0" max="12" value="3"></div>
    <div class="cut-actions">
      <button data-a="person"><i data-lucide="user-round"></i>Tự cắt người</button>
      <button data-a="all"><i data-lucide="image"></i>Lấy cả ảnh</button>
      <button data-a="clear"><i data-lucide="rotate-ccw"></i>Làm lại</button>
    </div>
  </div>
</div>

<div id="sheet" hidden>
  <div class="sheet-card">
    <img id="savePreview" alt="Ảnh đã chỉnh">
    <div class="sheet-actions">
      <button id="btnShare" class="primary"><i data-lucide="share"></i>Lưu vào Ảnh / Chia sẻ</button>
      <button id="btnDownload" class="ghost"><i data-lucide="download"></i>Tải file về</button>
      <button id="btnCloseSheet" class="text">Đóng</button>
    </div>
    <small id="saveHint"></small>
  </div>
</div>

<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
